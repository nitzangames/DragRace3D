<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Drag Race 3D — Thumbnail Mockups</title>
<meta name="viewport" content="width=device-width,initial-scale=1" />
<style>
  html, body {
    margin: 0; padding: 0; height: 100%;
    background: #0a0e14; color: #fff; font-family: system-ui;
    display: flex; flex-direction: column; align-items: center;
    justify-content: center; gap: 20px;
  }
  .stage { position: relative; }
  canvas { display: block; border-radius: 14px; }
  #panel {
    background: rgba(8,12,20,0.85); border: 1px solid #2a2f3a;
    border-radius: 10px; padding: 8px; display: flex; gap: 6px;
  }
  .mock-btn {
    background: #1a1d22; color: #fff; border: 2px solid #555; border-radius: 8px;
    padding: 8px 14px; font: 600 13px system-ui; cursor: pointer;
    letter-spacing: 0.04em; touch-action: manipulation;
  }
  .mock-btn.active { border-color: #2aa050; background: #1a3520; }
  .mock-btn:hover:not(.active) { border-color: #888; }
  #info {
    background: rgba(8,12,20,0.85); border: 1px solid #2a2f3a;
    border-radius: 10px; padding: 10px 16px;
    max-width: 600px; font-size: 13px; line-height: 1.4; text-align: center;
  }
  #info .label { color: #888; font-size: 11px; letter-spacing: 0.08em; margin-bottom: 4px; }
  #info .desc { color: #fff; }
  #back {
    position: fixed; top: 16px; left: 16px;
    background: transparent; border: 2px solid #888; color: #fff;
    border-radius: 8px; padding: 6px 12px; font: 600 14px system-ui;
    cursor: pointer; text-decoration: none;
  }
  .hint { color: #888; font-size: 12px; margin-top: -6px; }
</style>
</head>
<body>
<a id="back" href="../track-scenery/">‹ MOCKUPS</a>
<div id="panel">
  <button class="mock-btn" data-thumb="hero">A · HERO TREE</button>
  <button class="mock-btn active" data-thumb="side">B · 3/4 SIDE</button>
  <button class="mock-btn" data-thumb="topdown">C · TOP-DOWN</button>
  <button class="mock-btn" data-thumb="frontal">D · FRONTAL</button>
</div>
<div class="stage">
  <canvas id="thumb" width="600" height="600"></canvas>
</div>
<div class="hint">Underlying buffer renders at 1024×1024 (game-thumbnail spec) and scales down for preview.</div>
<div id="info">
  <div class="label">THUMBNAIL COMPOSITION</div>
  <div id="info-desc" class="desc"></div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script type="module">
import { buildCar } from '/js/car-models.js';
import { buildAmphitheater } from '/js/scenery.js';

const T = window.THREE;
const canvas = document.getElementById('thumb');
// 1024 underlying buffer, CSS-scaled to 600 preview
canvas.width = 1024; canvas.height = 1024;
canvas.style.width = '600px'; canvas.style.height = '600px';

// preserveDrawingBuffer keeps the WebGL framebuffer readable after a render,
// which is what render-thumbnail.js needs when it captures the canvas via
// toDataURL outside of the render tick. Slight memory cost; fine for a
// static thumbnail mockup.
const renderer = new T.WebGLRenderer({ canvas, antialias: true, preserveDrawingBuffer: true });
renderer.setPixelRatio(1);
renderer.setSize(1024, 1024, false);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = T.PCFSoftShadowMap;

let scene, camera;
let theme = 'hero';

function buildScene() {
  scene = new T.Scene();
  scene.background = new T.Color(0x6f93b8);  // crisp daytime sky

  scene.add(new T.AmbientLight(0xb8c4d8, 0.55));
  scene.add(new T.HemisphereLight(0xa8c8ff, 0x3a3020, 0.4));
  const sun = new T.DirectionalLight(0xfff0d0, 1.3);
  sun.position.set(20, 30, 12);
  sun.castShadow = true;
  sun.shadow.mapSize.width = 1024; sun.shadow.mapSize.height = 1024;
  sun.shadow.camera.near = 1; sun.shadow.camera.far = 80;
  sun.shadow.camera.left = -25; sun.shadow.camera.right = 25;
  sun.shadow.camera.top = 25; sun.shadow.camera.bottom = -25;
  sun.shadow.bias = -0.0005;
  scene.add(sun);

  // Asphalt strip patch (smaller than full-strip — thumbnail focuses on staging)
  const stripCanvas = document.createElement('canvas');
  stripCanvas.width = 256; stripCanvas.height = 1024;
  const sc = stripCanvas.getContext('2d');
  sc.fillStyle = '#2d2d31'; sc.fillRect(0, 0, 256, 1024);
  for (let i = 0; i < 1500; i++) {
    sc.fillStyle = `rgba(255,255,255,${(Math.random()*0.06).toFixed(3)})`;
    sc.fillRect(Math.random()*256, Math.random()*1024, 2, 2);
  }
  sc.fillStyle = '#d6b22f'; sc.fillRect(126, 0, 4, 1024);
  sc.fillStyle = '#dddddd'; sc.fillRect(8, 0, 4, 1024); sc.fillRect(244, 0, 4, 1024);
  const stripTex = new T.CanvasTexture(stripCanvas);
  stripTex.wrapS = stripTex.wrapT = T.RepeatWrapping;
  stripTex.repeat.set(1, 8); stripTex.anisotropy = 4;
  const strip = new T.Mesh(new T.PlaneGeometry(15, 80),
    new T.MeshLambertMaterial({ map: stripTex }));
  strip.rotation.x = -Math.PI/2;
  strip.position.set(0, 0, -30);
  strip.receiveShadow = true;
  scene.add(strip);

  const dirt = new T.Mesh(new T.PlaneGeometry(120, 120),
    new T.MeshLambertMaterial({ color: 0x6a5a3c }));
  dirt.rotation.x = -Math.PI/2; dirt.position.set(0, -0.05, -20);
  dirt.receiveShadow = true;
  scene.add(dirt);

  // Christmas tree with green light lit (race-go moment)
  const tree = new T.Group();
  const post = new T.Mesh(new T.BoxGeometry(0.4, 6, 0.4),
    new T.MeshLambertMaterial({ color: 0x202020 }));
  post.position.y = 3; post.castShadow = true; tree.add(post);
  // Bulbs: amber 1-3 lit warm, amber 4 off, GREEN lit bright
  for (let i = 0; i < 5; i++) {
    for (const sx of [-1, 1]) {
      let color;
      if (i < 3) color = 0xffaa00;       // amber lit
      else if (i === 3) color = 0x551100; // pre-stage off
      else color = 0x22ee48;              // GREEN lit
      const bulb = new T.Mesh(new T.SphereGeometry(0.22, 12, 8),
        new T.MeshBasicMaterial({ color }));
      bulb.position.set(sx * 0.5, 5.5 - i * 0.9, 0);
      tree.add(bulb);
    }
  }
  tree.position.set(0, 0, -1.5);
  scene.add(tree);

  // Two cars staged at start. Player on +X (red muscle), opponent (blue supercar).
  const player = buildCar('muscle', 0xc83a26, 0x1a0a08, 'racing');
  player.traverse((m) => { if (m.isMesh) m.castShadow = true; });
  player.position.set(2.5, 0, 1.5);
  scene.add(player);

  const opponent = buildCar('supercar', 0x2a8fd4, 0x080808, 'dual');
  opponent.traverse((m) => { if (m.isMesh) m.castShadow = true; });
  opponent.position.set(-2.5, 0, 1.5);
  scene.add(opponent);

  // Tire smoke at the rear of both cars (sells the launch moment)
  const smokeMat = new T.MeshBasicMaterial({
    color: 0xcccccc, transparent: true, opacity: 0.55,
  });
  for (const cx of [-2.5, 2.5]) {
    for (let i = 0; i < 6; i++) {
      const r = 0.6 + i * 0.25;
      const smoke = new T.Mesh(new T.SphereGeometry(r, 8, 6), smokeMat);
      smoke.position.set(cx + (Math.random() - 0.5) * 0.4,
                         0.4 + Math.random() * 0.6,
                         3 + i * 0.5);
      scene.add(smoke);
    }
  }

  // Back row: full game amphitheater (8 stepped risers, 290m deep, top-rim
  // flags). Front row: a smaller 4-step bowl pulled in toward the strip
  // so the thumbnail reads as a layered stadium instead of one row of seats.
  buildAmphitheater(scene, T);
  buildFrontBowl(scene);

  // Title — billboard sprite that always faces the camera. Lives in the
  // scene so it gets baked into the rendered PNG along with the 3D layer.
  scene.add(makeTitleSprite());

  camera = new T.PerspectiveCamera(45, 1, 0.1, 200);
}

function buildFrontBowl(parent) {
  const stepLight = new T.MeshLambertMaterial({ color: 0xb0b0ac });
  const stepDark  = new T.MeshLambertMaterial({ color: 0x8a8a86 });
  const treadMat  = new T.MeshLambertMaterial({ color: 0xc0c0bc });
  const crowdMats = [0xff5040, 0x4060ff, 0xffd14a, 0x40c060, 0xeeeeee, 0xc040c0]
    .map((c) => new T.MeshLambertMaterial({ color: c }));
  const stepHeight = 0.7, stepDepth = 0.9;
  for (const side of [-1, 1]) {
    const startZ = -8, endZ = -80;
    const length = Math.abs(endZ - startZ);
    const midZ = (startZ + endZ) / 2;
    for (let row = 0; row < 4; row++) {
      const rowY = stepHeight * row;
      const rowX = side * (11 + row * stepDepth);
      const riser = new T.Mesh(
        new T.BoxGeometry(0.3, stepHeight, length),
        row % 2 === 0 ? stepLight : stepDark,
      );
      riser.position.set(rowX, rowY + stepHeight/2, midZ);
      riser.castShadow = true;
      parent.add(riser);
      const tread = new T.Mesh(new T.BoxGeometry(stepDepth, 0.15, length), treadMat);
      tread.position.set(rowX + side * stepDepth/2, rowY + stepHeight, midZ);
      tread.castShadow = true;
      parent.add(tread);
      for (let cz = startZ - 1; cz >= endZ + 1; cz -= 1.0) {
        if (Math.random() < 0.85) {
          const cube = new T.Mesh(
            new T.BoxGeometry(0.5, 0.55, 0.4),
            crowdMats[Math.floor(Math.random() * 6)],
          );
          cube.position.set(rowX + side * stepDepth/2, rowY + stepHeight + 0.27, cz);
          cube.castShadow = true;
          parent.add(cube);
        }
      }
    }
  }
}

function makeTitleSprite() {
  const c = document.createElement('canvas');
  c.width = 1024; c.height = 256;
  const ctx = c.getContext('2d');
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  // Vertical gradient — racing-yellow at top fading to orange below for a
  // bit of motorsport heat without going full chrome.
  const grad = ctx.createLinearGradient(0, 30, 0, 220);
  grad.addColorStop(0, '#fff5b0');
  grad.addColorStop(0.45, '#ffd14a');
  grad.addColorStop(1.0, '#ff7f00');
  // Heavy black stroke (then fill) gives strong readability at any size.
  ctx.font = 'bold italic 130px system-ui, "Helvetica Neue", sans-serif';
  ctx.lineWidth = 14;
  ctx.lineJoin = 'round';
  ctx.strokeStyle = '#000';
  ctx.strokeText('DRAG RACE 3D', 512, 128);
  ctx.fillStyle = grad;
  ctx.fillText('DRAG RACE 3D', 512, 128);
  const tex = new T.CanvasTexture(c);
  tex.minFilter = T.LinearFilter;
  tex.anisotropy = 4;
  const mat = new T.SpriteMaterial({ map: tex, transparent: true, depthTest: false });
  const sprite = new T.Sprite(mat);
  // Billboard positioned in the upper portion of the frame. Earlier draft
  // had y=8 + scale 14×3.5 which sat above the camera's vertical FOV at
  // composition B's distance — the title was rendering offscreen. y=5
  // with a 10×2.5 scale lands the title cleanly in the upper third.
  sprite.position.set(0, 5, -1);
  sprite.scale.set(10, 2.5, 1);
  sprite.renderOrder = 999;
  return sprite;
}

const COMPOSITIONS = {
  // ---- A · HERO TREE — christmas tree centered, low cinematic angle
  hero: () => {
    camera.fov = 38;
    camera.position.set(0, 1.6, 8);
    camera.lookAt(0, 2.8, -1.5);
  },
  // ---- B · 3/4 SIDE — heroic side angle showing both cars + tree
  side: () => {
    camera.fov = 42;
    camera.position.set(11, 4.5, 7);
    camera.lookAt(0, 1.5, -2);
  },
  // ---- C · TOP-DOWN — bird's-eye showing the staged cars from above
  topdown: () => {
    camera.fov = 50;
    camera.position.set(0, 18, 4);
    camera.lookAt(0, 0, -2);
  },
  // ---- D · FRONTAL — front-on rolling shot, cars filling the frame
  frontal: () => {
    camera.fov = 38;
    camera.position.set(0, 2.6, -5);
    camera.lookAt(0, 1.4, 4);
  },
};

const DESCRIPTIONS = {
  hero:
    'A · Hero Tree: low cinematic angle behind the cars, christmas tree green-lit dead-center. Title-card feel.',
  side:
    'B · 3/4 Side: heroic angle from the right side, both cars + the tree visible, classic motorsport magazine cover composition.',
  topdown:
    'C · Top-Down: birds-eye of the staged cars on the strip, lane lines + tire smoke read at a glance. Most "drag race" iconic.',
  frontal:
    'D · Frontal: looking back from in front of the cars at the start line, cars fill the lower frame, tree visible behind. Maximum drama, hero portrait.',
};

function setComposition(name) {
  theme = name;
  COMPOSITIONS[name]();
  document.getElementById('info-desc').textContent = DESCRIPTIONS[name];
  document.querySelectorAll('.mock-btn').forEach((b) => {
    b.classList.toggle('active', b.dataset.thumb === name);
  });
  renderer.render(scene, camera);
  // Signal to render-thumbnail.js (puppeteer) that the WebGL canvas now
  // has at least one frame committed.
  window.__rendered = true;
}

buildScene();
setComposition('side');

document.querySelectorAll('.mock-btn').forEach((b) => {
  b.addEventListener('click', () => setComposition(b.dataset.thumb));
});
</script>
</body>
</html>
