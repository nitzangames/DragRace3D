<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Drag Race 3D — Track Scenery Mockups</title>
<meta name="viewport" content="width=device-width,initial-scale=1" />
<style>
  html,body { margin:0; padding:0; height:100%; background:#0a0e14; color:#fff; font-family:system-ui; overflow:hidden; }
  #root { position:fixed; inset:0; }
  canvas { display:block; }
  #panel {
    position:fixed; top:16px; left:50%; transform:translateX(-50%);
    background:rgba(8,12,20,0.85); border:1px solid #2a2f3a; border-radius:10px;
    padding:8px; display:flex; gap:6px; z-index:10;
  }
  .mock-btn {
    background:#1a1d22; color:#fff; border:2px solid #555; border-radius:8px;
    padding:8px 14px; font:600 14px system-ui; cursor:pointer;
    letter-spacing:0.05em; touch-action:manipulation;
  }
  .mock-btn.active { border-color:#2aa050; background:#1a3520; }
  .mock-btn:hover:not(.active) { border-color:#888; }
  #info {
    position:fixed; bottom:16px; left:50%; transform:translateX(-50%);
    background:rgba(8,12,20,0.85); border:1px solid #2a2f3a; border-radius:10px;
    padding:10px 16px; max-width:600px; font-size:14px; line-height:1.4;
    text-align:center;
  }
  #info .label { color:#888; font-size:11px; letter-spacing:0.08em; margin-bottom:4px; }
  #info .desc { color:#fff; }
</style>
</head>
<body>
<div id="root"></div>
<div id="panel">
  <button class="mock-btn active" data-theme="stadium">STADIUM</button>
  <button class="mock-btn" data-theme="urban">URBAN</button>
  <button class="mock-btn" data-theme="desert">DESERT</button>
  <button class="mock-btn" data-theme="night">NIGHT</button>
</div>
<div id="info">
  <div class="label">SCENERY MOCKUP</div>
  <div id="info-desc" class="desc"></div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
const T = window.THREE;
const root = document.getElementById('root');

const renderer = new T.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
function resize() { renderer.setSize(window.innerWidth, window.innerHeight); }
resize();
window.addEventListener('resize', resize);
root.appendChild(renderer.domElement);

let scene, camera, sceneryGroup;
let theme = 'stadium';

// Camera orbit around staging area — gives a slow cinematic look at the
// track from multiple angles so scenery is visible across the full radius.
const orbitCenter = new T.Vector3(0, 2, -60);
const orbitRadius = 45;
const orbitHeight = 14;
let orbitAngle = 0.6;

function buildBaseScene(preset) {
  scene = new T.Scene();
  scene.background = new T.Color(preset.fogColor);
  scene.fog = new T.Fog(preset.fogColor, 60, preset.fogFar || 380);

  scene.add(new T.AmbientLight(preset.ambient, 0.55));
  scene.add(new T.HemisphereLight(0xa8c8ff, 0x3a3020, 0.4));
  const sun = new T.DirectionalLight(preset.sun, preset.sunIntensity);
  sun.position.set(...preset.sunPos);
  scene.add(sun);

  // Strip
  const stripCanvas = document.createElement('canvas');
  stripCanvas.width = 256; stripCanvas.height = 1024;
  const sc = stripCanvas.getContext('2d');
  sc.fillStyle = '#2d2d31'; sc.fillRect(0, 0, 256, 1024);
  for (let i = 0; i < 1500; i++) {
    sc.fillStyle = `rgba(255,255,255,${(Math.random()*0.06).toFixed(3)})`;
    sc.fillRect(Math.random()*256, Math.random()*1024, 2, 2);
  }
  sc.fillStyle = '#d6b22f'; sc.fillRect(126, 0, 4, 1024);
  sc.fillStyle = '#dddddd'; sc.fillRect(8, 0, 4, 1024); sc.fillRect(244, 0, 4, 1024);
  const stripTex = new T.CanvasTexture(stripCanvas);
  stripTex.wrapS = stripTex.wrapT = T.RepeatWrapping;
  stripTex.repeat.set(1, 60); stripTex.anisotropy = 4;
  const strip = new T.Mesh(new T.PlaneGeometry(15, 700), new T.MeshLambertMaterial({ map: stripTex }));
  strip.rotation.x = -Math.PI/2; strip.position.set(0, 0, -300);
  scene.add(strip);

  const dirt = new T.Mesh(new T.PlaneGeometry(300, 700),
    new T.MeshLambertMaterial({ color: preset.ground }));
  dirt.rotation.x = -Math.PI/2; dirt.position.set(0, -0.05, -300);
  scene.add(dirt);

  // Christmas tree
  const tree = new T.Group();
  const post = new T.Mesh(new T.BoxGeometry(0.4, 6, 0.4),
    new T.MeshLambertMaterial({ color: 0x202020 }));
  post.position.y = 3; tree.add(post);
  for (let i = 0; i < 5; i++) {
    for (const sx of [-1, 1]) {
      const c = i < 3 ? 0xffaa00 : (i === 4 ? 0x22ee48 : 0x551100);
      const bulb = new T.Mesh(new T.SphereGeometry(0.22, 12, 8),
        new T.MeshBasicMaterial({ color: c }));
      bulb.position.set(sx*0.5, 5.5 - i*0.9, 0);
      tree.add(bulb);
    }
  }
  tree.position.set(0, 0, -1.5);
  scene.add(tree);

  // Cars (placeholder boxes since this is just for scenery comparison)
  for (const cx of [-2.5, 2.5]) {
    const car = new T.Group();
    const body = new T.Mesh(new T.BoxGeometry(1.7, 0.9, 4),
      new T.MeshLambertMaterial({ color: cx > 0 ? 0xc83a26 : 0x4d6dd6 }));
    body.position.y = 0.55; car.add(body);
    const cabin = new T.Mesh(new T.BoxGeometry(1.55, 0.95, 2),
      new T.MeshLambertMaterial({ color: 0x222222 }));
    cabin.position.set(0, 1.45, -0.05); car.add(cabin);
    car.position.set(cx, 0, 2);
    scene.add(car);
  }

  // Finish gantry
  const gantry = new T.Group();
  const left = new T.Mesh(new T.BoxGeometry(0.6, 9, 0.6),
    new T.MeshLambertMaterial({ color: 0x444444 }));
  left.position.set(-7.5, 4.5, 0); gantry.add(left);
  const right = left.clone(); right.position.x = 7.5; gantry.add(right);
  const cross = new T.Mesh(new T.BoxGeometry(15.6, 1.2, 0.6),
    new T.MeshLambertMaterial({ color: 0xc04020 }));
  cross.position.set(0, 9, 0); gantry.add(cross);
  gantry.position.set(0, 0, -100);  // pulled in for visibility
  scene.add(gantry);

  sceneryGroup = new T.Group();
  scene.add(sceneryGroup);

  camera = new T.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 600);
}

// ===========================================================================
// SCENERY VARIANTS
// ===========================================================================

function buildStadium() {
  // Dense double-tier grandstands with crowd, banner overpass, scoreboard
  // pillar, and a finish-line jumbotron. Pro-track feel.
  const g = sceneryGroup;
  const standMat = new T.MeshLambertMaterial({ color: 0x556677 });
  const tierMat = new T.MeshLambertMaterial({ color: 0x445566 });
  const crowdMats = [0xff5040, 0x4060ff, 0xffd14a, 0x40c060, 0xeeeeee, 0xc040c0]
    .map(c => new T.MeshLambertMaterial({ color: c }));
  const crowdGeo = new T.BoxGeometry(0.55, 0.6, 0.45);

  for (let s = 0; s < 18; s++) {
    const sx = -16 + (s % 2) * 32;
    const sz = -20 - s * 14;
    // Lower tier
    const lower = new T.Mesh(new T.BoxGeometry(15, 4, 4), standMat);
    lower.position.set(sx, 2, sz); g.add(lower);
    // Upper tier (set back)
    const upper = new T.Mesh(new T.BoxGeometry(15, 4, 3.5), tierMat);
    upper.position.set(sx + (sx > 0 ? 1.5 : -1.5), 5.5, sz); g.add(upper);
    // Crowd on both tiers
    for (let cx = -2.5; cx <= 2.5; cx += 1.0) {
      for (let cz = -1.0; cz <= 1.0; cz += 1.0) {
        const m = crowdMats[Math.floor(Math.random() * 6)];
        const c = new T.Mesh(crowdGeo, m);
        c.position.set(sx + cx, 4.3, sz + cz);
        g.add(c);
        const c2 = new T.Mesh(crowdGeo, crowdMats[Math.floor(Math.random()*6)]);
        c2.position.set(sx + (sx > 0 ? 1.5 : -1.5) + cx, 7.8, sz + cz);
        g.add(c2);
      }
    }
  }

  // Banners between every other pair of stands — vertical bunting effect
  const bannerColors = [0xc83a26, 0xffd14a, 0x2a8fd4, 0x33dd55];
  for (let s = 0; s < 8; s++) {
    const z = -40 - s * 28;
    for (let bx = -10; bx <= 10; bx += 2) {
      const banner = new T.Mesh(
        new T.BoxGeometry(0.6, 1.4, 0.05),
        new T.MeshLambertMaterial({ color: bannerColors[(s + Math.abs(bx)) % 4] })
      );
      banner.position.set(bx, 11, z);
      g.add(banner);
    }
    const wire = new T.Mesh(new T.BoxGeometry(22, 0.05, 0.05),
      new T.MeshBasicMaterial({ color: 0x222222 }));
    wire.position.set(0, 11.8, z); g.add(wire);
  }

  // Scoreboard tower
  const tower = new T.Mesh(new T.BoxGeometry(8, 16, 4),
    new T.MeshLambertMaterial({ color: 0x333740 }));
  tower.position.set(28, 8, -150); g.add(tower);
  const screen = new T.Mesh(new T.PlaneGeometry(7, 5),
    new T.MeshBasicMaterial({ color: 0x80ff80 }));
  screen.position.set(28 - 2.05, 11, -150); screen.rotation.y = Math.PI/2; g.add(screen);

  // Light poles
  for (let z = -30; z >= -270; z -= 50) {
    for (const px of [-26, 26]) {
      const pole = new T.Mesh(new T.BoxGeometry(0.4, 12, 0.4),
        new T.MeshLambertMaterial({ color: 0x303030 }));
      pole.position.set(px, 6, z); g.add(pole);
      const bulb = new T.Mesh(new T.SphereGeometry(0.5, 12, 8),
        new T.MeshBasicMaterial({ color: 0xfff2c0 }));
      bulb.position.set(px, 12.4, z); g.add(bulb);
    }
  }
}

function buildUrban() {
  // Industrial backdrop — cracked-asphalt staging, warehouses, billboards,
  // smokestacks in distance. Outlaw-street-race vibe.
  const g = sceneryGroup;
  const warehouseMats = [
    new T.MeshLambertMaterial({ color: 0x4a4540 }),
    new T.MeshLambertMaterial({ color: 0x6a5a3a }),
    new T.MeshLambertMaterial({ color: 0x3a3a40 }),
    new T.MeshLambertMaterial({ color: 0x5a4a3a }),
  ];

  // Rows of warehouses along both sides at varied depths
  for (let s = 0; s < 12; s++) {
    const sx = (s % 2 === 0 ? -1 : 1) * (28 + (s % 4) * 6);
    const sz = -15 - s * 35;
    const w = 18 + (s % 3) * 6;
    const h = 8 + (s % 4) * 3;
    const d = 14;
    const mat = warehouseMats[s % 4];
    const wh = new T.Mesh(new T.BoxGeometry(w, h, d), mat);
    wh.position.set(sx, h/2, sz); g.add(wh);
    // Roof ridge
    const roof = new T.Mesh(new T.BoxGeometry(w, 0.4, d),
      new T.MeshLambertMaterial({ color: 0x222222 }));
    roof.position.set(sx, h + 0.2, sz); g.add(roof);
  }

  // Billboards (large flat signs facing the strip)
  const billboardColors = [0xff5040, 0xffd14a, 0x4060ff, 0xffffff];
  for (let i = 0; i < 5; i++) {
    const x = (i % 2 === 0 ? -1 : 1) * 35;
    const z = -50 - i * 60;
    const post1 = new T.Mesh(new T.BoxGeometry(0.4, 8, 0.4),
      new T.MeshLambertMaterial({ color: 0x202020 }));
    post1.position.set(x - (x > 0 ? 3 : -3), 4, z); g.add(post1);
    const post2 = new T.Mesh(new T.BoxGeometry(0.4, 8, 0.4),
      new T.MeshLambertMaterial({ color: 0x202020 }));
    post2.position.set(x + (x > 0 ? 3 : -3), 4, z); g.add(post2);
    const bb = new T.Mesh(new T.BoxGeometry(8, 4, 0.3),
      new T.MeshLambertMaterial({ color: billboardColors[i % 4] }));
    bb.position.set(x, 9, z);
    bb.rotation.y = x > 0 ? -Math.PI/8 : Math.PI/8;
    g.add(bb);
  }

  // Smokestacks far in the distance
  for (let i = 0; i < 4; i++) {
    const x = -90 + i * 60;
    const stack = new T.Mesh(new T.CylinderGeometry(2, 2.5, 28, 12),
      new T.MeshLambertMaterial({ color: 0x6a4a3a }));
    stack.position.set(x, 14, -340); g.add(stack);
    // Smoke (stationary translucent box)
    const smoke = new T.Mesh(new T.SphereGeometry(4, 8, 6),
      new T.MeshBasicMaterial({ color: 0x666666, transparent: true, opacity: 0.4 }));
    smoke.position.set(x + 2, 32, -340); g.add(smoke);
  }

  // Concrete jersey barriers along strip edges
  for (let z = -10; z >= -340; z -= 5) {
    for (const bx of [-9, 9]) {
      const j = new T.Mesh(new T.BoxGeometry(4, 1.2, 0.8),
        new T.MeshLambertMaterial({ color: 0x9a9a96 }));
      j.position.set(bx, 0.6, z); g.add(j);
    }
  }

  // Distant overpass
  const overpass = new T.Mesh(new T.BoxGeometry(140, 4, 8),
    new T.MeshLambertMaterial({ color: 0x4a4a52 }));
  overpass.position.set(0, 18, -360); g.add(overpass);
  for (let px = -50; px <= 50; px += 25) {
    const pier = new T.Mesh(new T.BoxGeometry(4, 18, 8),
      new T.MeshLambertMaterial({ color: 0x4a4a52 }));
    pier.position.set(px, 9, -360); g.add(pier);
  }
}

function buildDesert() {
  // Palm trees, mountain backdrop, golden-hour lighting, sparse grandstands.
  const g = sceneryGroup;

  // Distant mountain silhouettes (low-poly cones)
  const mountainMat = new T.MeshLambertMaterial({ color: 0x8a6a4a });
  const mtnGeo = new T.ConeGeometry(60, 50, 5);
  const mtnSpots = [
    [-180, -380, 1.0],  [-90, -440, 1.3],  [0, -400, 1.5],
    [90, -440, 1.2],    [180, -380, 0.95], [-150, -340, 0.7],
    [140, -340, 0.8],
  ];
  for (const [x, z, scale] of mtnSpots) {
    const mtn = new T.Mesh(mtnGeo, mountainMat);
    mtn.position.set(x, 25 * scale - 5, z);
    mtn.scale.set(scale, scale, scale);
    g.add(mtn);
  }

  // Sandstone outcrops mid-distance
  const stoneMat = new T.MeshLambertMaterial({ color: 0xb89060 });
  for (let i = 0; i < 6; i++) {
    const x = (i % 2 === 0 ? -1 : 1) * (60 + i * 8);
    const z = -120 - i * 35;
    const stone = new T.Mesh(new T.BoxGeometry(8, 6 + (i % 3)*2, 7), stoneMat);
    stone.position.set(x, 3 + (i%3), z);
    g.add(stone);
  }

  // Palm trees scattered
  const trunkGeo = new T.CylinderGeometry(0.25, 0.4, 7, 8);
  const trunkMat = new T.MeshLambertMaterial({ color: 0x6a4a2c });
  const frondMat = new T.MeshLambertMaterial({ color: 0x3a8a3a });
  const palmSpots = [
    [-30, -25], [35, -55], [-40, -90], [42, -130], [-50, -170],
    [38, -210], [-32, -240], [45, -280], [-28, -310], [40, -350],
    [-55, -65], [55, -100], [-58, -200], [60, -250], [-45, -330],
  ];
  for (const [x, z] of palmSpots) {
    const trunk = new T.Mesh(trunkGeo, trunkMat);
    trunk.position.set(x, 3.5, z); g.add(trunk);
    // Fronds — 6 box "leaves" radiating from the top
    for (let f = 0; f < 6; f++) {
      const angle = (f / 6) * Math.PI * 2;
      const frond = new T.Mesh(new T.BoxGeometry(2.5, 0.1, 0.4), frondMat);
      frond.position.set(x + Math.cos(angle) * 1.3, 7.2,
                        z + Math.sin(angle) * 1.3);
      frond.rotation.y = angle;
      frond.rotation.z = -0.3;
      g.add(frond);
    }
    // Palm coconuts (small dark spheres)
    const coconut = new T.Mesh(new T.SphereGeometry(0.25, 8, 6),
      new T.MeshLambertMaterial({ color: 0x3a2410 }));
    coconut.position.set(x, 6.8, z); g.add(coconut);
  }

  // Sparse grandstand (just one set of bleachers)
  const standMat = new T.MeshLambertMaterial({ color: 0xa07050 });
  for (let s = 0; s < 4; s++) {
    const stand = new T.Mesh(new T.BoxGeometry(15, 5, 4), standMat);
    stand.position.set(-22, 2.5, -30 - s * 16); g.add(stand);
  }

  // Distant cacti
  const cactusMat = new T.MeshLambertMaterial({ color: 0x4a7a4a });
  for (const [x, z] of [[-65, -150], [62, -120], [-72, -200], [70, -260], [-50, -290]]) {
    const c = new T.Mesh(new T.CylinderGeometry(0.6, 0.7, 3, 8), cactusMat);
    c.position.set(x, 1.5, z); g.add(c);
    const arm = new T.Mesh(new T.CylinderGeometry(0.4, 0.4, 1.4, 8), cactusMat);
    arm.position.set(x + 0.7, 2.2, z); arm.rotation.z = -0.6; g.add(arm);
  }
}

function buildNight() {
  // Neon signs, streetlights, dim sky, LED tire-walls. Tokyo street vibe.
  const g = sceneryGroup;

  // Low warehouses with neon-edged silhouettes
  const buildingMat = new T.MeshLambertMaterial({ color: 0x141820 });
  for (let s = 0; s < 14; s++) {
    const sx = (s % 2 === 0 ? -1 : 1) * (24 + (s % 3) * 4);
    const sz = -15 - s * 24;
    const w = 14 + (s % 3) * 5;
    const h = 9 + (s % 4) * 3;
    const b = new T.Mesh(new T.BoxGeometry(w, h, 12), buildingMat);
    b.position.set(sx, h/2, sz); g.add(b);
    // Neon edge strip on the roofline (varies color per building)
    const neonColors = [0xff20a0, 0x40ffff, 0xffff40, 0xff4040, 0x40ff40];
    const edge = new T.Mesh(new T.BoxGeometry(w + 0.2, 0.2, 12.2),
      new T.MeshBasicMaterial({ color: neonColors[s % 5] }));
    edge.position.set(sx, h, sz); g.add(edge);
    // Glowing window grid
    const winRows = Math.floor(h / 2) - 1;
    const winCols = Math.floor(w / 2.5) - 1;
    const winMat = new T.MeshBasicMaterial({ color: 0xffe080 });
    const winGeo = new T.BoxGeometry(0.8, 0.6, 0.05);
    for (let r = 0; r < winRows; r++) {
      for (let c = 0; c < winCols; c++) {
        if (Math.random() < 0.55) {
          const win = new T.Mesh(winGeo, winMat);
          const wxLocal = -w/2 + 1.4 + c * 2.4;
          const wyLocal = 1 + r * 1.8;
          win.position.set(sx + wxLocal, wyLocal, sz + (sx > 0 ? -6.05 : 6.05));
          g.add(win);
        }
      }
    }
  }

  // Vertical neon signs (skyscraper-style logos)
  const neonSignColors = [0xff20a0, 0x40ffff, 0xffff40, 0xff8040, 0x80ff40];
  for (let i = 0; i < 4; i++) {
    const x = (i % 2 === 0 ? -1 : 1) * 36;
    const z = -50 - i * 70;
    const sign = new T.Mesh(new T.BoxGeometry(0.3, 14, 2.5),
      new T.MeshBasicMaterial({ color: neonSignColors[i] }));
    sign.position.set(x, 14, z); g.add(sign);
  }

  // Streetlights — taller, halo glow, more frequent
  for (let z = -20; z >= -340; z -= 30) {
    for (const px of [-19, 19]) {
      const pole = new T.Mesh(new T.BoxGeometry(0.3, 9, 0.3),
        new T.MeshLambertMaterial({ color: 0x202020 }));
      pole.position.set(px, 4.5, z); g.add(pole);
      const bulb = new T.Mesh(new T.SphereGeometry(0.6, 12, 8),
        new T.MeshBasicMaterial({ color: 0xffd980 }));
      bulb.position.set(px, 9.2, z); g.add(bulb);
      // Halo glow disk
      const halo = new T.Mesh(new T.CircleGeometry(2.5, 16),
        new T.MeshBasicMaterial({ color: 0xffd980, transparent: true, opacity: 0.15 }));
      halo.position.set(px, 9.2, z);
      halo.lookAt(px, 0, z + 1);
      g.add(halo);
    }
  }

  // LED-strip tire walls (cyan glow)
  const ledWallGeo = new T.BoxGeometry(2, 0.6, 0.4);
  const ledMat = new T.MeshBasicMaterial({ color: 0x40ffff });
  for (let z = -10; z >= -340; z -= 4) {
    for (const bx of [-9, 9]) {
      const led = new T.Mesh(ledWallGeo, ledMat);
      led.position.set(bx, 0.3, z); g.add(led);
    }
  }

  // Distant skyline silhouette
  const skylineMat = new T.MeshLambertMaterial({ color: 0x080a14 });
  for (let i = 0; i < 12; i++) {
    const x = -120 + i * 22;
    const h = 20 + (i % 5) * 8;
    const sky = new T.Mesh(new T.BoxGeometry(18, h, 12), skylineMat);
    sky.position.set(x, h/2, -380); g.add(sky);
  }
}

// ===========================================================================
// PRESETS (lighting per theme)
// ===========================================================================
const PRESETS = {
  stadium: {
    fogColor: 0x9bb8d8, fogFar: 380, ambient: 0xa8b8d8, ground: 0x6a5a3c,
    sun: 0xfff0d0, sunIntensity: 1.1, sunPos: [60, 90, 40],
  },
  urban: {
    fogColor: 0xc0c0b8, fogFar: 380, ambient: 0xa0a0a0, ground: 0x60554a,
    sun: 0xfff0d0, sunIntensity: 0.95, sunPos: [40, 60, 30],
  },
  desert: {
    fogColor: 0xf2c890, fogFar: 480, ambient: 0xc8a070, ground: 0xb89060,
    sun: 0xff9c40, sunIntensity: 1.4, sunPos: [-30, 25, -40],
  },
  night: {
    fogColor: 0x0a0e18, fogFar: 320, ambient: 0x1a2030, ground: 0x15181d,
    sun: 0x6080a0, sunIntensity: 0.35, sunPos: [60, 90, 40],
  },
};

const DESCRIPTIONS = {
  stadium:
    'Pro-track feel: dense double-tier grandstands, packed crowd, banner overpasses, finish-line scoreboard tower.',
  urban:
    'Outlaw street race: warehouses, billboards, distant overpass, factory smokestacks, jersey barriers along the strip.',
  desert:
    'Salt-flats / Mojave aesthetic: palm trees, sandstone outcrops, mountain horizon, golden-hour lighting.',
  night:
    'Neon Tokyo: lit windows, vertical neon signs, halo streetlights, LED tire-walls, distant skyline silhouette.',
};

function setTheme(name) {
  theme = name;
  buildBaseScene(PRESETS[name]);
  if      (name === 'stadium') buildStadium();
  else if (name === 'urban')   buildUrban();
  else if (name === 'desert')  buildDesert();
  else if (name === 'night')   buildNight();
  document.getElementById('info-desc').textContent = DESCRIPTIONS[name];
  document.querySelectorAll('.mock-btn').forEach((b) => {
    b.classList.toggle('active', b.dataset.theme === name);
  });
}

document.querySelectorAll('.mock-btn').forEach((b) => {
  b.addEventListener('click', () => setTheme(b.dataset.theme));
});

setTheme('stadium');

function tick() {
  orbitAngle += 0.0035;
  camera.position.set(
    orbitCenter.x + Math.sin(orbitAngle) * orbitRadius,
    orbitCenter.y + orbitHeight,
    orbitCenter.z + Math.cos(orbitAngle) * orbitRadius
  );
  camera.lookAt(orbitCenter);
  renderer.render(scene, camera);
  requestAnimationFrame(tick);
}
tick();
</script>
</body>
